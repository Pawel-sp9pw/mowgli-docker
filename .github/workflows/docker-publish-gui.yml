name: Build patched OpenMower GUI

on:
  push:
    branches:
      - mowgli-map-editor-fix
    paths:
      - 'docker/openmower-gui/**'
      - '.github/workflows/docker-publish-gui.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/pawel-sp9pw/openmower-gui
    steps:
      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up multi-arch builder
        shell: bash
        run: |
          set -euo pipefail
          docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64
          docker buildx create --name mowgli-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Login to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push patched GUI
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file docker/openmower-gui/Dockerfile \
            --tag "${IMAGE_NAME}:mowgli-map-editor-fix" \
            --tag "${IMAGE_NAME}:latest" \
            --push \
            .
