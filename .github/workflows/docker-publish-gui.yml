name: Build patched OpenMower GUI

on:
  push:
    branches:
      - mowgli-map-editor-fix
    paths:
      - 'docker/openmower-gui/**'
      - '.github/workflows/docker-publish-gui.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/openmower-gui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pawel-sp9pw/openmower-gui:mowgli-map-editor-fix
            ghcr.io/pawel-sp9pw/openmower-gui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Trigger build after enabling Actions.
