services:
  watchtower:
    image: containrrr/watchtower
    command:
      - --api-version
      - '1.40'
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: 'true'   # cleanup old openmower-gui images
      WATCHTOWER_POLL_INTERVAL: 14400   # update check intervall in seconds - eg 14400 = 4h
      WATCHTOWER_DEBUG: 'false'
      WATCHTOWER_LABEL_ENABLE: 'true'
  gui:
    container_name: openmower-gui
    labels:
      "com.centurylinklabs.watchtower.enable": true
      project: openmower
      app: gui
    image: ghcr.io/pawel-sp9pw/openmower-gui:mowgli-map-editor-fix
    build:
      context: .
      dockerfile: docker/openmower-gui/Dockerfile
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      ROS_IP: ${ROS_IP}
      ROS_MASTER_URI: http://${ROS_IP}:11311
      MOWER_CONFIG_FILE: /config/mower_config.sh
      DOCKER_HOST: unix:///var/run/docker.sock
      DB_PATH: /db
    depends_on:
      roscore:
        condition: service_healthy
    volumes:
      - /dev:/dev
      - ./config/db:/db
      - ./config/om:/config
      - /var/run/docker.sock:/var/run/docker.sock
  OpenMowerApp:
    image: ghcr.io/clemenselflein/openmowerapp:latest
    container_name: OpenMowerApp
    restart: unless-stopped
    ports:
      - "4005:8080"

  mosquitto:
    container_name: mowgli-mqtt
    labels:
      project: openmower
      app: mqtt
    hostname: mosquitto
    image: eclipse-mosquitto:latest
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - ./config/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  roscore:
    container_name: mowgli-roscore
    labels:
      project: openmower
      app: roscore
    image: ${IMAGE}
    network_mode: host
    #pull_policy: always
    tty: true
    privileged: true
    command:
      # roscore runs as non-root (uid 1000); fix ownership of the bind-mounted
      # ROS home (Docker creates ./ros as root)
      - bash
      - -c
      - "sudo chown -R 1000:1000 /home/openmower/.ros && exec /opt/ros/noetic/bin/roscore"
    environment:
      ROS_IP: ${ROS_IP}
      ROS_MASTER_URI: http://${ROS_IP}:11311
      ROSCONSOLE_CONFIG_FILE: /config/rosconsole.config
      ROSOUT_DISABLE_FILE_LOGGING: true
    tmpfs:
      - /home/openmower/.ros/log:uid=1000,gid=1000,mode=755
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/noetic/setup.sh && rosnode list >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    volumes:
      - ./ros:/home/openmower/.ros/
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  rosserial:
    container_name: mowgli-rosserial
    labels:
      project: openmower
      app: rosserial
    image: ${IMAGE}
    network_mode: host
    #pull_policy: always
    tty: true
    privileged: true
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 10m
    environment:
      ROS_MASTER_URI: http://${ROS_IP}:11311
      ROS_IP: ${ROS_IP}
      DEBUG: false
    command:
      - /opt/ros/noetic/bin/rosrun
      - rosserial_server
      - serial_node
      - _port:=/dev/mowgli
      - _baud:=115200
    tmpfs:
      - /home/openmower/.ros/log:uid=1000,gid=1000,mode=755
    volumes:
      - ./ros:/home/openmower/.ros/
      - /etc/timezone:/etc/timezone:ro
      - /dev:/dev
    depends_on:
      roscore:
        condition: service_healthy
    restart: unless-stopped

  openmower:
    container_name: mowgli-openmower
    labels:
      project: openmower
      app: openmower
    image: ${IMAGE}
    network_mode: host
    #pull_policy: always
    tty: true
    privileged: true
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 10m
    environment:
      ROS_MASTER_URI: http://${ROS_IP}:11311
      ROS_IP: ${ROS_IP}
      # Mowgli uses CUSTOM mower type meaning ALL params are loaded from custom_params.yaml and HARDWARE_PLATFORM/ESC_TYPE mean nothing.
      MOWER: CUSTOM
      ESC_TYPE: xesc_mini
      HARDWARE_PLATFORM: "1"
      PARAMS_PATH: /home/openmower/mower_params
      OM_NO_COMMS: true
      DEBUG: false
    command:
      - bash
      - -c
      - roslaunch --wait open_mower open_mower.launch --screen
    tmpfs:
      - /home/openmower/.ros/log:uid=1000,gid=1000,mode=755  # comment this line out to enable persistent logs
    volumes:
      - ./mower_params:/home/openmower/mower_params:ro
      - ./ros:/home/openmower/.ros/
      - /etc/timezone:/etc/timezone:ro
      - /dev:/dev
    depends_on:
      roscore:
        condition: service_healthy
      rosserial:
        condition: service_started
    restart: unless-stopped
  app:
    image: ghcr.io/xtech/openmower-app:edge
    container_name: app
    ports:
      - 3000:3000
    restart: unless-stopped
